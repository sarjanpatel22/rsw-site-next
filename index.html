<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Designed in its own colours: a phone's dark mode (Samsung Internet's, Chrome's) mustn't repaint it -->
  <meta name="color-scheme" content="only light">
  <title>RSW — Real Saiyan Wellness</title>
  <!-- Test site: keep search engines out. Remove at launch. -->
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <!-- The site is two pages, one per mode: Clean (clean/) and Manga (manga/). This one only sends visitors to the
       mode they used last, Clean the first time; the mode picker then asks on their first visit in a tab. -->
  <script>
    let mode = 'clean';
    try { mode = localStorage.getItem('rsw-mode') === 'manga' ? 'manga' : 'clean'; } catch {}
    location.replace(`${mode}/index.html${location.hash}`);
  </script>
</head>
<body>
  <p><a href="clean/index.html">RSW Clean</a> · <a href="manga/index.html">RSW Manga</a></p>
</body>
</html>
